[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expression-mesh"
version = "0.2.0"
description = "Reproducible facial-expression classification from MediaPipe Face Mesh landmarks"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Igor Kostenko" }]
keywords = ["computer-vision", "mediapipe", "facial-expression-recognition", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<2.0",
    "scikit-learn==1.4.1.post1",
]

[project.optional-dependencies]
vision = [
    "mediapipe>=0.10.14,<0.11",
    "opencv-python>=4.9,<5",
]
generation = [
    "accelerate>=0.28,<2",
    "diffusers>=0.27,<1",
    "torch>=2.2,<3",
    "transformers>=4.39,<5",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
expression-mesh-model-info = "expression_mesh.model_info:main"
expression-mesh-prepare-data = "expression_mesh.dataset:main"
expression-mesh-train = "expression_mesh.training:main"
expression-mesh-webcam = "expression_mesh.webcam:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
